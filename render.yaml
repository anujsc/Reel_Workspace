services:
  # Frontend - React SPA
  - type: web
    name: reel-workspace-frontend
    env: static
    region: oregon
    plan: free
    rootDir: Reel_Workspace/client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reel-workspace-api.onrender.com

  # Backend - Node.js API
  - type: web
    name: reel-workspace-api
    env: node
    region: oregon
    plan: free
    rootDir: Reel_Workspace/server
    buildCommand: bash render-build.sh
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://reel-workspace-frontend.onrender.com
      - key: SERVER_URL
        value: https://reel-workspace.onrender.com
      - key: USE_YTDLP
        value: "true"
      - key: USE_INSTALOADER
        value: "true"
      - key: USE_SOCIALKIT
        value: "true"
      - key: SOCIALKIT_ACCESS_KEY
        sync: false
      - key: SOCIALKIT_TIMEOUT_MS
        value: "30000"
      - key: PYTHON_EXECUTABLE
        value: python3
      - key: EXTRACTOR_DOH_URL
        value: https://cloudflare-dns.com/dns-query
      - key: YTDLP_TIMEOUT_MS
        value: "120000"
      - key: INSTALOADER_TIMEOUT_MS
        value: "120000"
      - key: EXTRACT_MAX_FILE_SIZE_MB
        value: "50"
      # Add your other environment variables in Render dashboard:
      # - MONGODB_URI
      # - JWT_SECRET
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET
      # - GEMINI_API_KEY_TRANSCRIPT
      # - GROQ_API_KEY
